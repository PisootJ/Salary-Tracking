<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salary Tracking Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Sarabun',sans-serif; background:#f0f4f8; min-height:100vh; padding:24px; color:#2d3748; }

  /* Loading overlay */
  .loading-overlay { position:fixed; inset:0; background:rgba(240,244,248,0.92); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999; gap:16px; }
  .loading-overlay.hidden { display:none; }
  .spinner { width:44px; height:44px; border:4px solid #e2e8f0; border-top-color:#4fd1c5; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { font-size:14px; color:#718096; font-weight:500; }
  .error-box { background:#fff5f5; border:1px solid #feb2b2; border-radius:12px; padding:20px 28px; text-align:center; max-width:360px; }
  .error-box p { color:#c53030; font-size:13px; margin-bottom:12px; line-height:1.6; }
  .retry-btn { background:#e53e3e; color:#fff; border:none; border-radius:8px; padding:8px 20px; font-family:'Sarabun',sans-serif; font-size:13px; font-weight:600; cursor:pointer; }
  .retry-btn:hover { background:#c53030; }

  .header { text-align:center; margin-bottom:20px; }
  .header h1 { font-size:22px; font-weight:700; color:#4a5568; }
  .header p { font-size:13px; color:#a0aec0; margin-top:4px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; }
  .refresh-btn { background:#edf2f7; border:1.5px solid #e2e8f0; border-radius:8px; padding:3px 12px; font-family:'Sarabun',sans-serif; font-size:12px; font-weight:600; color:#4a5568; cursor:pointer; transition:background 0.15s; }
  .refresh-btn:hover { background:#e2e8f0; }

  .top-bar { display:flex; justify-content:center; gap:12px; margin-bottom:24px; flex-wrap:wrap; }
  .top-bar select { background:#fff; border:2px solid #e2e8f0; border-radius:12px; padding:10px 20px; font-size:15px; font-family:'Sarabun',sans-serif; font-weight:600; color:#4a5568; cursor:pointer; outline:none; box-shadow:0 2px 8px rgba(0,0,0,0.06); transition:border-color 0.2s; min-width:230px; }
  .top-bar select:focus { border-color:#90cdf4; }

  .card.done .num { color:#2d3748; } .card.active .num { color:#f6ad55; } .card.wait .num { color:#cbd5e0; } .card.days .num { color:#68d391; }
  .card.active { min-width:200px; max-width:300px; }

  .progress-label { display:flex; justify-content:space-between; font-size:12px; color:#a0aec0; margin-bottom:8px; font-weight:600; }
  .progress-bar-bg { background:#edf2f7; border-radius:99px; height:14px; overflow:hidden; }
  .progress-bar-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,#81e6d9,#4fd1c5); transition:width 0.6s ease; }

  .timeline-container { max-width:820px; margin:0 auto; }
  .step-item { display:flex; align-items:flex-start; }
  .step-left { display:flex; flex-direction:column; align-items:center; width:48px; flex-shrink:0; }
  .step-icon { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex-shrink:0; z-index:1; }
  .step-icon.done { background:#2d3748; color:#fff; box-shadow:0 2px 6px rgba(45,55,72,0.3); }
  .step-icon.active { background:#fef3c7; border:2.5px solid #f6ad55; color:#d69e2e; }
  .step-icon.wait { background:#f7fafc; border:2px dashed #cbd5e0; color:#cbd5e0; }
  .step-line { width:2px; flex:1; min-height:18px; background:#e2e8f0; margin-top:2px; }
  .step-line.done-line { background:#4a5568; }

  .step-content { flex:1; background:#fff; border-radius:14px; padding:14px 16px; margin-bottom:10px; box-shadow:0 2px 8px rgba(0,0,0,0.05); margin-left:12px; position:relative; overflow:hidden; }
  .step-content.done { border-left:4px solid #2d3748; opacity:0.85; }
  .step-content.active { border-left:4px solid #f6ad55; }
  .step-content.wait { border-left:4px solid #e2e8f0; opacity:0.6; }

  @keyframes blink-glow { 0%,100%{box-shadow:0 0 0 0 rgba(246,173,85,0);} 50%{box-shadow:0 0 0 6px rgba(246,173,85,0.22);} }
  @keyframes pulse-dot  { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:0.4;transform:scale(0.85);} }
  .step-content.active { animation:blink-glow 1.8s infinite; }
  .step-icon.active { animation:pulse-dot 1.5s infinite; }

  .step-header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px; }
  .step-title { font-size:14px; font-weight:600; color:#2d3748; }
  .step-content.wait .step-title { color:#a0aec0; }
  .step-badge { font-size:11px; font-weight:700; padding:3px 10px; border-radius:99px; white-space:nowrap; }
  .badge-done { background:#e2e8f0; color:#4a5568; } .badge-active { background:#fef3c7; color:#b7791f; } .badge-wait { background:#f7fafc; color:#cbd5e0; border:1px solid #e2e8f0; }
  .step-meta { margin-top:8px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .meta-item { font-size:12px; color:#718096; }
  .days-badge { background:#ebf8ff; color:#2b6cb0; font-size:11px; font-weight:700; border-radius:99px; padding:2px 10px; }
  .step-content.done .days-badge { background:#e6fffa; color:#2c7a7b; }
  .step-content.wait .days-badge { background:#f7fafc; color:#cbd5e0; }
  .resp-tag { font-size:11px; background:#f0fff4; color:#276749; border-radius:6px; padding:2px 8px; font-weight:500; }
  .step-content.wait .resp-tag { background:#f7fafc; color:#cbd5e0; }
  .active-label { position:absolute; top:0; right:0; background:linear-gradient(135deg,#fef3c7,#fed7aa); color:#c05621; font-size:10px; font-weight:700; padding:3px 10px; border-radius:0 14px 0 10px; }

  /* Sub toggle button */
  .sub-toggle-btn { display:flex; align-items:center; gap:7px; margin-top:10px; padding:7px 12px; background:#f7fafc; border:1.5px solid #e2e8f0; border-radius:10px; cursor:pointer; font-family:'Sarabun',sans-serif; font-size:12px; font-weight:600; color:#4a5568; width:100%; transition:background 0.15s; text-align:left; }
  .sub-toggle-btn:hover { background:#edf2f7; }
  .sub-toggle-arrow { margin-left:auto; font-size:11px; transition:transform 0.25s; display:inline-block; }
  .sub-toggle-arrow.open { transform:rotate(180deg); }
  /* Sub section (collapsed by default) */
  .sub-section { margin-top:6px; padding-top:8px; border-top:1px dashed #e2e8f0; display:none; }
  .sub-section.expanded { display:block; }
  .sub-filter-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .sub-filter-bar label { font-size:11px; color:#718096; font-weight:600; }
  .sub-filter-select { font-family:'Sarabun',sans-serif; font-size:11px; padding:4px 10px; border-radius:8px; border:1.5px solid #e2e8f0; background:#f7fafc; color:#4a5568; outline:none; cursor:pointer; font-weight:600; }
  .sub-filter-select:focus { border-color:#90cdf4; }
  .sub-count-tag { font-size:11px; color:#a0aec0; margin-left:4px; }

  /* Sub mini summary */
  .sub-mini-summary { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .mini-card { background:#f7fafc; border-radius:8px; padding:4px 12px; font-size:11px; font-weight:700; display:flex; gap:5px; align-items:center; }
  .mini-card.mc-done { background:#f0fff4; color:#276749; } .mini-card.mc-active { background:#fffbeb; color:#b7791f; } .mini-card.mc-wait { background:#f7fafc; color:#a0aec0; }

  /* Sub list */
  .sub-list { }
  .group-label { font-size:10px; font-weight:700; color:#a0aec0; letter-spacing:0.6px; text-transform:uppercase; padding:6px 4px 2px; }
  .sub-row { display:flex; align-items:center; gap:7px; padding:5px 4px; border-bottom:1px solid #f7fafc; font-size:12.5px; }
  .sub-row:last-child { border-bottom:none; }
  .sub-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .sub-dot.done { background:#4a5568; } .sub-dot.active { background:#f6ad55; animation:pulse-dot 1.5s infinite; } .sub-dot.wait { background:#e2e8f0; border:1.5px dashed #cbd5e0; }
  .type-tag { font-size:10px; font-weight:700; border-radius:5px; padding:1px 7px; white-space:nowrap; flex-shrink:0; }
  .tt-sso { background:#ebf8ff; color:#2b6cb0; } .tt-rph { background:#f0fff4; color:#276749; } .tt-ssk { background:#faf5ff; color:#6b46c1; }
  .sub-name { flex:1; color:#4a5568; } .sub-name.dimmed { color:#cbd5e0; } .sub-name.over14 { color:#ed8936; font-weight:600; }
  .sub-dates { font-size:11px; color:#a0aec0; }
  .sub-days-ok { font-size:11px; font-weight:700; color:#68d391; }
  .sub-days-act { font-size:11px; font-weight:700; color:#f6ad55; }
  .sub-upd { font-size:11px; color:#a0aec0; }
  .no-result { padding:10px 4px; font-size:12px; color:#a0aec0; text-align:center; }

  /* Slowest unit banner */
  .slowest-banner { background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:6px 12px; font-size:12px; color:#92400e; font-weight:600; margin-top:8px; line-height:1.5; }
</style>

<body>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <p class="loading-text">กำลังโหลดข้อมูลจาก Google Drive...</p>
</div>

<div class="header">
  <h1>📋 ติดตามการเลื่อนเงินเดือน</h1>
  <p>
    Salary Increment Tracking — สสจ.กาญจนบุรี
    &nbsp;|&nbsp;
    <span id="updateTime">กำลังโหลด...</span>
    <button class="refresh-btn" onclick="loadAllData()">🔄 รีเฟรช</button>
  </p>
</div>

<div class="top-bar">
  <select id="roundSelect" onchange="renderAll()">
    <option value="apr69">รอบ 1 เม.ย. 2569</option>
    <option value="oct69">รอบ 1 ต.ค. 2569</option>
  </select>
</div>

<div class="summary-cards" id="summaryCards"></div>
<div class="progress-wrap">
  <div class="progress-label"><span>ความคืบหน้า</span><span id="pPct">0%</span></div>
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="pFill" style="width:0%"></div></div>
</div>
<div class="timeline-container" id="timeline"></div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────
const SHEET_ID = '1lJHWkPH6zu-kG9BpLUIoEIZwm0otJ3zFw533rVvS8YQ';
const SHEET_NAMES = {
  apr69: 'tracking_apr69',
  oct69: 'tracking_oct69'
};
const ROUND_TITLES = {
  apr69: 'รอบ 1 เม.ย. 2569',
  oct69: 'รอบ 1 ต.ค. 2569'
};

// ─── STATE ───────────────────────────────────────────────────────────
const DATA = {};
const SF = {};   // filter state per step id

// ─── DATE UTILITIES ──────────────────────────────────────────────────
const THAI_MONTHS = {
  "ม.ค.":1,"ก.พ.":2,"มี.ค.":3,"เม.ย.":4,"พ.ค.":5,"มิ.ย.":6,
  "ก.ค.":7,"ส.ค.":8,"ก.ย.":9,"ต.ค.":10,"พ.ย.":11,"ธ.ค.":12,
  "มกราคม":1,"กุมภาพันธ์":2,"มีนาคม":3,"เมษายน":4,"พฤษภาคม":5,"มิถุนายน":6,
  "กรกฎาคม":7,"สิงหาคม":8,"กันยายน":9,"ตุลาคม":10,"พฤศจิกายน":11,"ธันวาคม":12
};

// Normalize Thai date string to canonical "D Mon YYYY" (BE)
// Robust: searches for month key as substring — not sensitive to surrounding whitespace/chars
function normDate(s) {
  if (!s || !s.trim()) return null;
  s = s.trim();
  // Day: leading digits
  const dayM = s.match(/^(\d{1,2})/);
  if (!dayM) return null;
  const day = parseInt(dayM[1]);
  // Year: trailing digits (2 or 4)
  const yearM = s.match(/(\d{2,4})\s*$/);
  if (!yearM) return null;
  let year = parseInt(yearM[1]);
  if (year < 100) year += 2500;
  // Month: find any THAI_MONTHS key that appears in the string
  let monthKey = null;
  for (const k of Object.keys(THAI_MONTHS)) {
    if (s.includes(k)) { monthKey = k; break; }
  }
  if (!monthKey) return null;
  return `${day} ${monthKey} ${year}`;
}

// Parse canonical Thai date string to JS Date (CE). Returns null on any failure.
function parseThaiDate(s) {
  if (!s) return null;
  s = s.trim();
  const dayM = s.match(/^(\d{1,2})/);
  if (!dayM) return null;
  const yearM = s.match(/(\d{2,4})\s*$/);
  if (!yearM) return null;
  let year = parseInt(yearM[1]);
  if (year < 100) year += 2500;
  let mo = null;
  for (const [k, v] of Object.entries(THAI_MONTHS)) {
    if (s.includes(k)) { mo = v; break; }
  }
  if (!mo) return null;
  year -= 543; // BE → CE
  const d = new Date(year, mo - 1, parseInt(dayM[1]));
  return isNaN(d.getTime()) ? null : d;
}

function daysBetween(d1str, d2str) {
  const d1 = parseThaiDate(d1str);
  const d2 = parseThaiDate(d2str);
  if (!d1 || !d2) return null;
  return Math.round((d2 - d1) / 86400000);
}

function daysFromToday(dateStr) {
  const d = parseThaiDate(dateStr);
  if (!d) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((today - d) / 86400000);
}

// ─── CSV PARSER ──────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = [];
  let cur = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQ) {
      if (ch === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else { field += ch; }
    } else {
      if (ch === '"') { inQ = true; }
      else if (ch === ',') { cur.push(field); field = ''; }
      else if (ch === '\n') { cur.push(field); lines.push(cur); cur = []; field = ''; }
      else if (ch !== '\r') { field += ch; }
    }
  }
  if (field || cur.length) { cur.push(field); lines.push(cur); }
  return lines;
}

// ─── CSV → DATA STRUCTURE ────────────────────────────────────────────
function csvToData(rows, roundKey) {
  const title = ROUND_TITLES[roundKey];
  const steps = [];
  let currentStep = null;

  // Dynamically find data start: look for the "ลำดับ" column header row,
  // then begin parsing from the next row (handles any number of title/instruction rows)
  let dataStart = 0;
  for (let i = 0; i < Math.min(rows.length, 10); i++) {
    if ((rows[i][0] || '').trim() === 'ลำดับ') {
      dataStart = i + 1;
      break;
    }
  }

  for (let i = dataStart; i < rows.length; i++) {
    const row = rows[i];
    const col0 = (row[0] || '').trim();
    const col1 = (row[1] || '').trim();

    // Skip empty rows and legend rows
    if (!col0 && !col1) continue;
    if (col1.startsWith('LEGEND') || col0.startsWith('LEGEND')) continue;

    const dateReceive = normDate(row[2]);
    const dateSend    = normDate(row[3]);
    const status      = (row[4] || '').trim().toLowerCase() || 'wait';
    const responsible = (row[6] || '').trim();
    const updatedBy   = (row[7] || '').trim() || null;

    const stepNum = parseInt(col0);
    if (col0 && !isNaN(stepNum)) {
      // ── Step row ──
      let days = null;
      if (status === 'done' && dateReceive && dateSend) {
        days = daysBetween(dateReceive, dateSend);
      } else if (status === 'active' && dateReceive) {
        days = daysFromToday(dateReceive);
      }
      currentStep = {
        id: stepNum,
        name: col1,
        status,
        dateReceive: dateReceive || null,
        dateSend: dateSend || null,
        days,
        responsible: responsible || null,
        updatedBy,
        subs: []
      };
      steps.push(currentStep);

    } else if (!col0 && col1 && currentStep) {
      // ── Sub row ──
      // col[6] is the type tag: สสอ. / รพ. / สสจ.
      let type = 'สสจ.';
      if (responsible.includes('สสอ')) type = 'สสอ.';
      else if (responsible.includes('รพ')) type = 'รพ.';

      let days = null;
      if (status === 'done' && dateReceive && dateSend) {
        days = daysBetween(dateReceive, dateSend);
      } else if (status === 'active' && dateReceive) {
        days = daysFromToday(dateReceive);
      }

      currentStep.subs.push({
        name: col1,
        type,
        status,
        dateReceive: dateReceive || null,
        dateSend: dateSend || null,
        days,
        updatedBy
      });
    }
  }

  // Derive step status from subs (if step has subs, override status from CSV)
  for (const step of steps) {
    if (!step.subs.length) continue;
    if (step.subs.every(s => s.status === 'done')) step.status = 'done';
    else if (step.subs.some(s => s.status === 'done' || s.status === 'active')) step.status = 'active';
    else step.status = 'wait';
    // Recalculate days for sub-based steps
    if (step.status === 'active' && step.dateReceive) {
      step.days = daysFromToday(step.dateReceive);
    }
  }

  return { title, steps };
}

// ─── FETCH ───────────────────────────────────────────────────────────
async function fetchSheet(roundKey) {
  const sheetName = SHEET_NAMES[roundKey];
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status} (${sheetName})`);
  const text = await resp.text();
  const rows = parseCSV(text);
  return csvToData(rows, roundKey);
}

async function loadAllData() {
  const overlay = document.getElementById('loadingOverlay');
  overlay.innerHTML = '<div class="spinner"></div><p class="loading-text">กำลังโหลดข้อมูลจาก Google Drive...</p>';
  overlay.classList.remove('hidden');

  try {
    const [apr, oct] = await Promise.all([fetchSheet('apr69'), fetchSheet('oct69')]);
    DATA.apr69 = apr;
    DATA.oct69 = oct;

    const now = new Date();
    const timeStr = now.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
    const dateStr = now.toLocaleDateString('th-TH', {day:'numeric', month:'short', year:'numeric'});
    document.getElementById('updateTime').textContent = `อัปเดต: ${dateStr} ${timeStr}`;

    renderAll();
    overlay.classList.add('hidden');
  } catch(e) {
    overlay.innerHTML = `
      <div class="error-box">
        <p>❌ โหลดข้อมูลไม่สำเร็จ<br><small>${e.message}</small><br><br>
        ตรวจสอบว่า Google Sheet ตั้งค่า "Anyone with the link" → View แล้วหรือยัง</p>
        <button class="retry-btn" onclick="loadAllData()">🔄 ลองใหม่</button>
      </div>`;
  }
}

// ─── SLOWEST UNIT HELPER ─────────────────────────────────────────────
function getSlowest(subs) {
  const done = subs.filter(s => s.status === 'done' && s.dateSend);
  if (!done.length) return null;
  let maxDate = null;
  done.forEach(s => {
    const d = parseThaiDate(s.dateSend);
    if (d && (!maxDate || d > maxDate)) maxDate = d;
  });
  if (!maxDate) return null;
  const tied = done.filter(s => {
    const d = parseThaiDate(s.dateSend);
    return d && d.getTime() === maxDate.getTime();
  });
  // ถ้าหน่วยที่ช้าที่สุดมีจำนวน > 80% ของทั้งหมด ถือว่าไม่มีใครล่าช้า
  if (tied.length / done.length > 0.8) return null;
  return { names: tied.map(s => s.name), count: tied.length };
}

// ─── FILTER HELPERS ───────────────────────────────────────────────────
function getOrInitSF(sid) {
  if (!SF[sid]) SF[sid] = { status:'all', type:'all' };
  return SF[sid];
}
function applyFilter(subs, sid) {
  const f = getOrInitSF(sid);
  return subs.filter(s =>
    (f.status === 'all' || s.status === f.status) &&
    (f.type   === 'all' || s.type   === f.type)
  );
}

// ─── RENDER HELPERS ───────────────────────────────────────────────────
function getStatus(step) {
  if (!step.subs || !step.subs.length) return step.status;
  if (step.subs.every(s => s.status === 'done')) return 'done';
  if (step.subs.some(s => s.status === 'done' || s.status === 'active')) return 'active';
  return 'wait';
}
function badge(s){ return s==='done'?'เสร็จแล้ว':s==='active'?'กำลังดำเนินการ':'รอดำเนินการ'; }
function typeTag(t) {
  if (t==='สสอ.') return `<span class="type-tag tt-sso">สสอ.</span>`;
  if (t==='รพ.')  return `<span class="type-tag tt-rph">รพ.</span>`;
  return `<span class="type-tag tt-ssk">สสจ.</span>`;
}

function buildSubHtml(subs, sid) {
  const groups = ['สสอ.','รพ.','สสจ.'];
  const filtered = applyFilter(subs, sid);
  if (!filtered.length) return `<div class="no-result">ไม่พบข้อมูลที่กรอง</div>`;
  let h = '';
  groups.forEach(g => {
    const items = filtered.filter(s => s.type === g);
    if (!items.length) return;
    h += `<div class="group-label">${g}</div>`;
    items.forEach(s => {
      const dimmed = s.status === 'wait' ? ' dimmed' : '';
      const dates = s.dateReceive ? `${s.dateReceive}${s.dateSend?' → '+s.dateSend:''}` : '—';
      // Compute days at render-time as fallback (in case parse-time computation returned null)
      let rd = s.days;
      if (rd == null && s.status === 'done' && s.dateReceive && s.dateSend) {
        rd = daysBetween(s.dateReceive, s.dateSend);
      } else if (rd == null && s.status === 'active' && s.dateReceive) {
        rd = daysFromToday(s.dateReceive);
      }
      const over14 = rd != null && rd > 14;
      const daysH = rd != null
        ? `<span class="${s.status==='done'?'sub-days-ok':'sub-days-act'}">${rd} วัน</span>` : '';
      const updH  = s.updatedBy ? `<span class="sub-upd">👤 ${s.updatedBy}</span>` : '';
      h += `<div class="sub-row">
        <div class="sub-dot ${s.status}"></div>
        ${typeTag(s.type)}
        <span class="sub-name${dimmed}${over14?' over14':''}">${s.name}</span>
        <span class="sub-dates">${dates}</span>
        ${daysH}${updH}
      </div>`;
    });
  });
  return h;
}

function updateSubSection(sid) {
  const key = document.getElementById('roundSelect').value;
  const step = DATA[key] && DATA[key].steps.find(s => s.id === sid);
  const wrap = document.getElementById(`sub-wrap-${sid}`);
  if (!wrap || !step) return;
  const shown = applyFilter(step.subs, sid).length;
  wrap.querySelector('.sub-count-tag').textContent = `แสดง ${shown}/${step.subs.length}`;
  wrap.querySelector('.sub-body').innerHTML = buildSubHtml(step.subs, sid);
}

function onSF(sid, field, val) {
  getOrInitSF(sid)[field] = val;
  updateSubSection(sid);
}

function toggleSub(sid, btn) {
  const wrap = document.getElementById(`sub-wrap-${sid}`);
  if (!wrap) return;
  const isOpen = wrap.classList.toggle('expanded');
  const arrow = btn.querySelector('.sub-toggle-arrow');
  if (arrow) arrow.classList.toggle('open', isOpen);
}

// ─── MAIN RENDER ─────────────────────────────────────────────────────
function renderAll() {
  // Reset filter state
  Object.keys(SF).forEach(k => delete SF[k]);

  const key = document.getElementById('roundSelect').value;
  if (!DATA[key]) return;
  const steps = DATA[key].steps;

  let dc=0, ac=0, wc=0, td=0;
  let activeStep = null;
  steps.forEach(s => {
    const st = getStatus(s);
    if (st === 'done') { dc++; if (s.days) td += s.days; }
    else if (st === 'active') { ac++; if (!activeStep) activeStep = s; }
    else wc++;
  });
  const pct = steps.length ? Math.round(dc / steps.length * 100) : 0;

  document.getElementById('summaryCards').innerHTML = `
    <div class="card done"><div class="num">${dc}</div><div class="label">✅ เสร็จแล้ว</div></div>
    <div class="card active"><div class="label">⚡ ขั้นตอนปัจจุบัน</div><div class="step-name">${activeStep ? activeStep.name : '—'}</div></div>
    <div class="card wait"><div class="num">${wc}</div><div class="label">⬜ รอดำเนินการ</div></div>
    <div class="card days"><div class="num">${td}</div><div class="label">📅 วันรวม</div></div>`;
  document.getElementById('pPct').textContent = pct + '%';
  document.getElementById('pFill').style.width = pct + '%';

  let html = '';
  steps.forEach((step, idx) => {
    const st = getStatus(step);
    const isLast = idx === steps.length - 1;
    const icon = st === 'done' ? '✓' : step.id;

    let meta = '';
    if (step.dateReceive) meta += `<span class="meta-item">📅 วันที่เริ่ม: ${step.dateReceive}</span>`;
    if (step.dateSend)    meta += `<span class="meta-item">🏁 วันที่เสร็จ: ${step.dateSend}</span>`;
    if (step.updatedBy)   meta += `<span class="meta-item">👤 ${step.updatedBy}</span>`;
    const resp  = step.responsible ? `<span class="resp-tag">🏢 ${step.responsible}</span>` : '';
    const daysH = step.days != null ? `<span class="days-badge">${step.days} วัน</span>` : '';
    const liveLabel = st === 'active' ? '<div class="active-label">🔴 LIVE</div>' : '';

    // Sub section for any step that has subs
    let subSec = '';
    if (step.subs && step.subs.length) {
      const subs = step.subs;
      const sid = step.id;
      getOrInitSF(sid);
      const dc2 = subs.filter(s => s.status === 'done').length;
      const ac2 = subs.filter(s => s.status === 'active').length;
      const wc2 = subs.filter(s => s.status === 'wait').length;
      const ssoC = subs.filter(s => s.type === 'สสอ.').length;
      const rphC = subs.filter(s => s.type === 'รพ.').length;
      const sskC = subs.filter(s => s.type === 'สสจ.').length;
      const shown = applyFilter(subs, sid).length;

      const slowInfo = (sid === 3 || sid === 5) ? null : getSlowest(subs);
      const slowBanner = slowInfo
        ? `<div class="slowest-banner">🐢 ช้าที่สุด (${slowInfo.count} หน่วย${slowInfo.count>1?', วันเดียวกัน':''}): ${slowInfo.names.join(', ')}</div>`
        : '';

      subSec = slowBanner + `
        <button class="sub-toggle-btn" onclick="toggleSub(${sid},this)">
          <span>📋 รายละเอียดหน่วยงาน</span>
          <div class="sub-mini-summary" style="display:flex;gap:6px;margin:0;">
            <div class="mini-card mc-done">✅ ${dc2}</div>
            <div class="mini-card mc-active">⚡ ${ac2}</div>
            <div class="mini-card mc-wait">⬜ ${wc2}</div>
          </div>
          <span class="sub-toggle-arrow">▼</span>
        </button>
        <div class="sub-section" id="sub-wrap-${sid}">
          <div class="sub-filter-bar">
            <label>กรองสถานะ:</label>
            <select class="sub-filter-select" onchange="onSF(${sid},'status',this.value)">
              <option value="all">ทุกสถานะ (${subs.length})</option>
              <option value="done">✅ เสร็จแล้ว (${dc2})</option>
              <option value="active">⚡ กำลังดำเนินการ (${ac2})</option>
              <option value="wait">⬜ รอดำเนินการ (${wc2})</option>
            </select>
            <label>ประเภท:</label>
            <select class="sub-filter-select" onchange="onSF(${sid},'type',this.value)">
              <option value="all">ทุกประเภท (${subs.length})</option>
              ${ssoC ? `<option value="สสอ.">สสอ. (${ssoC})</option>` : ''}
              ${rphC ? `<option value="รพ.">รพ. (${rphC})</option>` : ''}
              ${sskC ? `<option value="สสจ.">สสจ. (${sskC})</option>` : ''}
            </select>
            <span class="sub-count-tag">แสดง ${shown}/${subs.length}</span>
          </div>
          <div class="sub-body">${buildSubHtml(subs, sid)}</div>
        </div>`;
    }

    html += `
      <div class="step-item">
        <div class="step-left">
          <div class="step-icon ${st}">${icon}</div>
          ${!isLast ? `<div class="step-line${st==='done'?' done-line':''}"></div>` : ''}
        </div>
        <div class="step-content ${st}">
          ${liveLabel}
          <div class="step-header">
            <span class="step-title">ขั้นตอน ${step.id} — ${step.name}</span>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">${daysH}<span class="step-badge badge-${st}">${badge(st)}</span></div>
          </div>
          ${(meta||resp) ? `<div class="step-meta">${meta}${resp}</div>` : ''}
          ${subSec}
        </div>
      </div>`;
  });

  document.getElementById('timeline').innerHTML = html;
}

// ─── INIT ────────────────────────────────────────────────────────────
loadAllData();
</script>
</body>
</html>
